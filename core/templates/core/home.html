<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>django-terraform-starter</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; display: grid; place-items: center; min-height: 100vh;
            background: Canvas; color: CanvasText;
        }
        main { max-width: 40rem; padding: 2rem; }
        h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
        p { line-height: 1.5; opacity: 0.85; }
        code { background: color-mix(in srgb, CanvasText 10%, transparent); padding: 0.1em 0.35em; border-radius: 4px; }
        ul { line-height: 1.9; }
    </style>
</head>
<body>
    <main>
        <h1>It works.</h1>
        <p>The Django + Daphne + Celery + Redis + Postgres stack is running.</p>
        <ul>
            <li>Health check: <a href="/healthz/"><code>/healthz/</code></a></li>
            <li>Admin: <a href="/admin/"><code>/admin/</code></a></li>
        </ul>
        <p>Deploy it to AWS ECS with the modules in <code>terraform/</code>.</p>
    </main>
</body>
</html>
